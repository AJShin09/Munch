<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#33506e"/>
  </marker>
</defs>
<rect width="1000" height="260" fill="#ffffff"/>
<text x="500" y="40" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#5b6b7c" font-weight="normal">s = xyz, with |s| ≥ p and xyⁱz ∈ L for every i ≥ 0</text>
<rect x="120" y="90" width="180" height="64" fill="#e8eef5" stroke="#33506e" stroke-width="1.6"/>
<rect x="300" y="90" width="120" height="64" fill="#d6e2ee" stroke="#33506e" stroke-width="1.6"/>
<rect x="420" y="90" width="460" height="64" fill="#eef3f8" stroke="#33506e" stroke-width="1.6"/>
<text x="210" y="130" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" fill="#16232f" font-weight="normal">x</text>
<text x="360" y="130" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" fill="#16232f" font-weight="normal">y</text>
<text x="650" y="130" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle" fill="#16232f" font-weight="normal">z</text>
<text x="360" y="80" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#5b6b7c" font-weight="normal">|y| ≥ 1</text>
<path d="M120,178 v12 H420 v-12" fill="none" stroke="#33506e" stroke-width="1.6"/>
<text x="270" y="216" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" fill="#16232f" font-weight="normal">|xy| ≤ p</text>
<text x="500" y="248" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#5b6b7c" font-weight="normal">the loop y can be repeated or removed without leaving L</text>
</svg>